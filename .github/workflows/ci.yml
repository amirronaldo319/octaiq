name: Checks

on:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run build
      - name: Check the build for secrets
        run: npm run check:bundle
      - name: Real-browser checks
        run: |
          npx playwright install --with-deps chromium
          npm run e2e
      - name: Research code tests (Python)
        run: |
          python3 -m venv research/.venv
          research/.venv/bin/pip install -q numpy pandas scipy scikit-learn
          research/.venv/bin/python -m unittest discover -s research -p 'test_*.py'
