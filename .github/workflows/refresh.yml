name: Refresh predictions and record the ledger

# Re-runs the backtest on the latest open results data, saves new predictions to the append-only ledger
# (only while an event has not started), refreshes the published snapshot, and commits only if something
# meaningful changed. The commit time on GitHub is the public timestamp for each saved prediction.
on:
  schedule:
    - cron: '5 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Backtest on the latest results
        run: npm run backtest
      - name: Record predictions in the ledger
        run: npm run ledger
      - name: Save the latest betting-price consensus (skipped without a key)
        run: npm run prices
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
      - name: Refresh the public snapshot
        run: npm run snapshot
      - name: Fail loudly if the data went stale
        run: node server/freshness.ts
      - name: Commit if anything changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ledger data/prices public/data
          if git diff --cached --quiet; then
            echo "Nothing changed; no commit."
            exit 0
          fi
          git commit -m "chore(data): refresh predictions, ledger and snapshot"
          git pull --rebase origin main
          git push origin HEAD:main
          # Pushes made with the built-in token do not start other workflows, so ask for the deploy directly.
          gh workflow run pages.yml
